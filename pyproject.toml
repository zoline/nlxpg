[project]
name = "nlxpg"
version = "0.5.0"
description = "문서에서 PostgreSQL 스키마(DDL)를 설계하는 Text-to-Database (NL → PG)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "asyncpg>=0.29",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# 문서 파싱 도구는 아직 선정 전이라(plan.md §인프라) 선택 설치로 둔다.
parsing = [
    "docling>=2.0",
]
# Claude(Anthropic API) — 외부 API라 사내 문서가 아닌 실행에만 쓴다(ADR-0008). 온프렘만 쓰면 필요 없다.
claude = [
    "anthropic>=1.11",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
nlxpg = "nlxpg.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 license 표현식
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nlxpg*"]

[tool.setuptools.package-data]
"nlxpg.api" = ["static/*.html", "static/vendor/*"]  # mermaid 라이선스 고지 포함
